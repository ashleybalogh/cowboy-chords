<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cowboy Chords</title>
    <link rel="stylesheet" href="src/theme.css" />
    <style>
      /* Layout only. Every colour, size and spacing value comes from
       * theme.css, and the chord box brings its own styles with it. */

      .page {
        max-width: 46rem;
        margin: 0 auto;
        padding: var(--space-7) var(--space-5) var(--space-8);
      }

      .page-title {
        margin: var(--space-1) 0 var(--space-5);
        font-family: var(--font-label);
        font-size: var(--text-xl);
        font-weight: var(--weight-label);
        letter-spacing: 0.04em;
        line-height: var(--leading-tight);
        text-transform: uppercase;
      }

      .chord-list-intro {
        max-width: var(--measure);
        margin: 0 0 var(--space-6);
        color: var(--pearl-dim);
      }

      .chord-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
        gap: var(--space-5);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .chord-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2);
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
      }

      .chord-cell-name {
        font-family: var(--font-label);
        font-size: var(--text-sm);
        font-weight: var(--weight-label);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: var(--pearl);
      }

      .chord-back {
        display: block;
        margin-bottom: var(--space-5);
        padding: 0;
        border: 0;
        background: none;
        color: var(--pearl-dim);
        cursor: pointer;
      }

      .chord-detail-name {
        margin: 0 0 var(--space-5);
        font-family: var(--font-label);
        font-size: var(--text-2xl);
        font-weight: var(--weight-label);
        letter-spacing: 0.04em;
        line-height: var(--leading-tight);
        text-transform: uppercase;
      }

      .chord-detail-box {
        margin-bottom: var(--space-6);
      }

      .chord-detail p {
        max-width: var(--measure);
        margin: 0 0 var(--space-4);
      }

      .chord-detail-root {
        color: var(--pearl);
      }

      .chord-detail p:not(.chord-detail-root) {
        color: var(--pearl-dim);
      }

      .chord-detail-quiet {
        font-size: var(--text-sm);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="label" id="eyebrow"></p>
      <h1 class="page-title" id="title"></h1>
      <div id="screen"></div>
    </main>

    <script type="module">
      import { strings } from "./src/strings.js";
      import { mountChords } from "./src/chords-screen.js";

      document.getElementById("eyebrow").textContent = strings.appName;
      document.getElementById("title").textContent = strings.chords.title;

      mountChords(document.getElementById("screen"));
    </script>
  </body>
</html>
