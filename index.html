<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cowboy Chords</title>
    <link rel="stylesheet" href="src/theme.css" />
    <style>
      /* Layout only. Every colour, size and spacing value comes from
       * theme.css, and the chord box brings its own styles with it. */

      .page {
        max-width: 46rem;
        margin: 0 auto;
        padding: var(--space-7) var(--space-5) var(--space-8);
      }

      .page-title {
        margin: var(--space-1) 0 var(--space-5);
        font-family: var(--font-label);
        font-size: var(--text-xl);
        font-weight: var(--weight-label);
        letter-spacing: 0.04em;
        line-height: var(--leading-tight);
        text-transform: uppercase;
      }

      /* --- buttons ------------------------------------------------------ */

      .action {
        padding: var(--space-3) var(--space-5);
        border: var(--hair) solid var(--nickel-dim);
        border-radius: var(--radius);
        background: var(--wood-raised);
        color: var(--pearl);
        font-family: var(--font-label);
        font-size: var(--text-sm);
        font-weight: var(--weight-label);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        cursor: pointer;
      }

      .action:hover {
        border-color: var(--nickel);
      }

      .action.is-quiet {
        background: none;
        color: var(--pearl-dim);
      }

      .chord-back {
        display: block;
        margin-bottom: var(--space-5);
        padding: 0;
        border: 0;
        background: none;
        color: var(--pearl-dim);
        cursor: pointer;
      }

      /* --- home --------------------------------------------------------- */

      /* One button and one line. Not two cards: a choice between equals is a
       * decision she has to make before she has played a note. */

      .start {
        display: block;
        width: 100%;
        max-width: var(--measure);
        padding: var(--space-6) var(--space-5);
        border: var(--hair) solid var(--bronze-dim);
        border-radius: var(--radius);
        background: var(--wood-raised);
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .start:hover {
        border-color: var(--bronze);
      }

      .start-name {
        display: block;
        color: var(--bronze);
        font-family: var(--font-label);
        font-size: var(--text-xl);
        font-weight: var(--weight-label);
        letter-spacing: var(--tracking-label);
        line-height: var(--leading-tight);
        text-transform: uppercase;
      }

      .start-note {
        display: block;
        margin-top: var(--space-2);
        color: var(--pearl-dim);
        font-size: var(--text-sm);
      }

      /* The quiet second thing. A sentence rather than a tile: it says where
       * she is, and it is also the way into the chord list. */
      .standing {
        display: block;
        max-width: var(--measure);
        margin-top: var(--space-6);
        padding: 0 0 var(--space-2);
        border: 0;
        border-bottom: var(--hair) solid var(--nickel-dim);
        background: none;
        color: var(--pearl);
        font-family: var(--font-body);
        font-size: var(--text-base);
        text-align: left;
        cursor: pointer;
      }

      .standing:hover {
        border-bottom-color: var(--nickel);
      }

      .home-days {
        margin-top: var(--space-4);
      }

      /* --- the chord list ----------------------------------------------- */

      .chord-list-intro {
        max-width: var(--measure);
        margin: 0 0 var(--space-6);
        color: var(--pearl-dim);
      }

      .chord-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
        gap: var(--space-5);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .chord-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2);
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
      }

      /* Locked is quieter, never crossed out or greyed to unreadable: seeing
       * what is coming is not the same as being told you can't have it. */
      .chord-cell.is-locked {
        opacity: 0.45;
      }

      .chord-cell-name {
        font-family: var(--font-label);
        font-size: var(--text-sm);
        font-weight: var(--weight-label);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: var(--pearl);
      }

      /* --- one chord up close ------------------------------------------- */

      .chord-detail-name {
        margin: 0 0 var(--space-5);
        font-family: var(--font-label);
        font-size: var(--text-2xl);
        font-weight: var(--weight-label);
        letter-spacing: 0.04em;
        line-height: var(--leading-tight);
        text-transform: uppercase;
      }

      .chord-detail-box {
        margin-bottom: var(--space-5);
      }

      .chord-hold {
        margin-bottom: var(--space-6);
      }

      .chord-hold p {
        margin-top: var(--space-2);
      }

      .chord-detail p {
        max-width: var(--measure);
        margin: 0 0 var(--space-4);
      }

      .chord-detail-root {
        color: var(--pearl);
      }

      .chord-detail p:not(.chord-detail-root) {
        color: var(--pearl-dim);
      }

      .chord-detail-quiet {
        font-size: var(--text-sm);
      }

      .chord-alternates {
        margin: var(--space-6) 0;
        padding-top: var(--space-5);
        border-top: var(--hair) solid var(--nickel-dim);
      }

      .chord-alternates-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-5);
        margin: var(--space-4) 0 0;
        padding: 0;
        list-style: none;
      }

      .chord-alternate {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2);
        max-width: 150px;
      }

      /* The labels wrap to different depths, so the controls are pinned to the
       * bottom rather than left on ragged baselines. */
      .chord-alternate > .action,
      .chord-alternate-mark {
        margin-top: auto;
      }

      .chord-alternate-label {
        margin: 0;
        color: var(--pearl-dim);
        font-size: var(--text-sm);
      }

      .chord-alternate-mark {
        margin: 0;
        color: var(--bronze);
      }

      /* --- the drill ----------------------------------------------------- */

      /* Two boxes side by side, and never smaller than the 150px floor the
       * gauges need: below the width where both fit, they stack. */
      .changes-boxes {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-6);
        justify-content: center;
        margin: var(--space-5) 0 var(--space-6);
      }

      .changes-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2);
      }

      .changes-note {
        max-width: var(--measure);
        margin: 0 auto var(--space-5);
        color: var(--pearl-dim);
        text-align: center;
      }

      .changes-clock {
        margin: 0 0 var(--space-5);
        color: var(--bronze);
        font-size: var(--text-score);
        line-height: 1;
        text-align: center;
      }

      .changes-count {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
      }

      .changes-count label {
        width: 100%;
        text-align: center;
      }

      .changes-input {
        width: 5rem;
        padding: var(--space-2) var(--space-3);
        border: var(--hair) solid var(--nickel-dim);
        border-radius: var(--radius);
        background: var(--wood-deep);
        color: var(--pearl);
        font-size: var(--text-xl);
        text-align: center;
      }

      .changes-problem {
        width: 100%;
        color: var(--pearl-dim);
        font-size: var(--text-sm);
        text-align: center;
      }

      /* The number, and nothing commenting on it. */
      .changes-score {
        margin: var(--space-6) 0 var(--space-2);
        color: var(--pearl);
        font-size: var(--text-score);
        line-height: 1;
        text-align: center;
      }

      .changes-line {
        display: flex;
        justify-content: center;
        margin-bottom: var(--space-2);
      }

      .changes-caption {
        margin: 0 0 var(--space-6);
        color: var(--pearl-dim);
        font-size: var(--text-sm);
        text-align: center;
      }

      /* --- strum --------------------------------------------------------- */

      .strum-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: var(--space-1);
        max-width: 26rem;
        margin: var(--space-5) 0;
        padding: 0;
        list-style: none;
      }

      .strum-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-1);
        padding: var(--space-3) 0;
        border: var(--hair) solid transparent;
        border-radius: var(--radius);
      }

      /* The off-beats sit back, so the four beats of the bar read first. */
      .strum-slot:not(.is-beat) .strum-count {
        color: var(--nickel-dim);
      }

      .strum-arrow {
        font-size: var(--text-xl);
        line-height: 1;
        color: var(--pearl-dim);
      }

      /* A slot with no arrow still shows the hand travelling: the space is
       * kept, because the pattern does not work if she stops moving. */
      .strum-slot:not(.is-struck) .strum-arrow::after {
        content: "·";
        color: var(--nickel-dim);
      }

      .strum-count {
        font-family: var(--font-number);
        font-size: var(--text-xs);
        color: var(--pearl-dim);
      }

      .strum-slot.is-now {
        border-color: var(--bronze-dim);
        background: var(--wood-raised);
      }

      .strum-slot.is-now .strum-arrow {
        color: var(--bronze);
      }

      .strum-note {
        max-width: var(--measure);
        margin: 0 0 var(--space-6);
        color: var(--pearl-dim);
        font-size: var(--text-sm);
      }

      .strum-tempo-row {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        max-width: var(--measure);
        margin-bottom: var(--space-5);
      }

      .strum-tempo {
        flex: 1;
        accent-color: var(--bronze);
      }

      .strum-bpm {
        min-width: 4.5rem;
        color: var(--pearl);
        text-align: right;
      }

      .strum-left {
        margin: var(--space-4) 0;
        color: var(--pearl-dim);
        font-size: var(--text-lg);
      }

      .changes-stop,
      .changes-count,
      .changes-score + .changes-line + .changes-caption + .action {
        display: block;
        margin-inline: auto;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <!-- The name appears exactly once per screen: as the heading on home,
           and as the way back everywhere else. An eyebrow that repeated the
           heading was saying nothing twice. -->
      <h1 class="page-title" id="title"></h1>
      <div id="screen"></div>
    </main>

    <script type="module">
      import { start } from "./src/app.js";

      start(document.getElementById("screen"));
    </script>
  </body>
</html>
